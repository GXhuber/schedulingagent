[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduling-agent"
version = "0.1.0"
description = "Email-driven meeting scheduling agent backed by Claude and Microsoft 365 calendar"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "msal>=1.31",
    "requests>=2.32",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
scheduling-agent = "scheduling_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["scheduling_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
